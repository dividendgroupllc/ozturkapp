<!--
	Kassa oynasi - statik karkas.

	=========================================================================
	DIQQAT: BU FAYLDA XOM APOSTROF (') ISHLATMANG - `&#39;` YOZING
	=========================================================================
	Frappe bu HTML ni JS satriga aylantiradi (frappe/build.py:420):

	    frappe.templates["restaurant_cashier"] = ' ...shu fayl mazmuni... ';

	Ya'ni mazmun BITTA TIRNOQ ichiga o'raladi. Frappe v15.100.0 da
	`scrub_html_template()` apostrofni ekranlashi KERAK edi, lekin u yerdagi
	kod aslida no-op:

	    return content.replace("'", "'")     # <- eski qiymat = yangi qiymat

	Natijada xom apostrof JS satrini erta yopadi va BUTUN SAHIFA SKRIPTI
	`SyntaxError` bilan yiqiladi - ekranda hech nima ko'rinmaydi.

	Shuning uchun matnda `&#39;` yoziladi: brauzer uni oddiy apostrof qilib
	ko'rsatadi, JS satri esa but qoladi.

	Bu qoidani `tests/test_cashier.py::TestPageAssets` tekshiradi.
	(Bu izohning o'zi ham apostrofsiz yozilgan - izohlar odatda olib
	tashlanadi, lekin unga tayanmaymiz.)
	=========================================================================

	Shablon HECH QANDAY ma&#39;lumot o'zgaruvchisini ishlatmaydi: barcha
	dinamik qismlar `public/js/cashier/` dagi modullarda, escape qilingan
	holda quriladi.
-->
<div class="rc-root" data-state="loading">

	<!-- ══ Yuklanmoqda ═══════════════════════════════════════════ -->
	<div class="rc-boot rc-boot--loading">
		<div class="rc-spinner" aria-hidden="true"></div>
		<p>Kassa yuklanmoqda…</p>
	</div>

	<!-- ══ Xato ══════════════════════════════════════════════════ -->
	<div class="rc-boot rc-boot--error" role="alert">
		<div class="rc-boot__icon">⚠</div>
		<h2 class="rc-boot__title">Kassani ochib bo&#39;lmadi</h2>
		<p class="rc-boot__message"></p>
		<button class="rc-btn rc-btn--primary rc-retry" type="button">Qayta urinish</button>
	</div>

	<!-- ══ Kassa yopiq - bloklovchi ekran ════════════════════════ -->
	<!--
		Smena ochilmaguncha kassa oynasi KO'RSATILMAYDI: stol ham, buyurtma
		ham chiqmaydi. Desktop POS dagi `PosOpeningPage` shu vazifani
		bajaradi - u ham to'liq ekranli, o'tkazib yuborib bo'lmaydigan qadam.
	-->

		<div class="rc-boot__icon">🔒</div>
		<h2 class="rc-boot__title">Kassa yopiq</h2>
		<p class="rc-boot__message">
			Sotuvni boshlash uchun kassadagi naqd pulni sanang va quyida kiriting.

	</div>

	<!-- ══ Asosiy ekran ══════════════════════════════════════════ -->
	<div class="rc-app">

		<!-- ── Yuqori panel (52px): zallar | holat filtri | smena, kassir, tez tugmalar, soat, menyu ── -->
		<header class="rc-topbar">
			<nav class="rc-rooms" aria-label="Zallar"></nav>
			<div class="rc-filters" role="group" aria-label="Stol holati filtri"></div>

			<div class="rc-topbar__spacer"></div>
			<div class="rc-shift" title="Kassa smenasi"></div>
			<div class="rc-cashier"></div>
			<div class="rc-topquick" hidden></div>
			<time class="rc-clock"></time>
			<span class="rc-live" title="Realtime ulanish"><i class="rc-live__dot"></i></span>
			<button class="rc-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false"
				aria-label="Menyu">⋯</button>

			<div class="rc-menu" hidden></div>
		</header>

		<!-- ── Sozlash ogohlantirishlari ────────────────────────── -->

		<!-- ── Asosiy ish maydoni ───────────────────────────────── -->
		<div class="rc-main">

			<!-- Chap: zal rejasi (tor ekranda Stollar | Buyurtmalar almashtirgichi bilan) -->

				<div class="rc-viewtabs" role="tablist"></div>

	<!-- ══ Modal oyna (to&#39;lov, tarix, smena yopish) ═══════════ -->

		</div>
	</div>
</div>
